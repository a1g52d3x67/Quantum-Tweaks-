Windows Registry Editor Version 5.00

; =========================================================
; GPU — NVIDIA GTX 16 series (Turing sin RT/Tensor)
; =========================================================

; HAGS funciona pero aporta poco; lo dejamos activo.
; Sin MPO disable agresivo (Turing lo lleva bien).
[HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Dwm]
"DisableMPO"=dword:00000000
"AllowTearingInDWM"=dword:00000001

; Refuerzo de shader cache (Turing se beneficia).
[HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\DirectX]
"ShaderCacheSize"=dword:00000800