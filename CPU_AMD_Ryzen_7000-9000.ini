Windows Registry Editor Version 5.00

; =========================================================
; CPU — AMD Ryzen 7000 a 9000 (Zen4/Zen5)
; Incluye modelos con doble CCD (7900X, 7950X, 9950X...)
; =========================================================

; PreferSystemAffinity=0: evita forzar cruce de CCD.
[HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Kernel]
"SchedulerAssist"=dword:00000000
"PreferSystemAffinity"=dword:00000000
"ThreadDpcEnable"=dword:00000001

[HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games]
"Affinity"=dword:fffffffe
"ThreadPriority"=dword:0000000f
"ThreadAffinity"=dword:000000fe
"ThreadPoolSize"=dword:00000040
"BackgroundThreadPool"=dword:00000010

[HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\PriorityControl]
"Win32PrioritySeparation"=dword:00000026