Windows Registry Editor Version 5.00

; =========================================================
; GPU — NVIDIA RTX 40 series (Ada Lovelace)
; =========================================================

; HAGS activo, gran beneficio en Ada.
[HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\GraphicsDrivers]
"HwSchMode"=dword:00000002

; MPO desactivado: en Ada evita bugs de flip.
[HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Dwm]
"DisableMPO"=dword:00000001
"AllowTearingInDWM"=dword:00000001

; Frame Generation friendly.
[HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\DirectX]
"ShaderCacheSize"=dword:00000c00
"DXGI_FRAME_LATENCY_WAITABLE_OBJECT"=dword:00000001